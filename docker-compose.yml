# ============================================================================
# Synapse Memory Protocol — Example 3-Node Cluster
# ============================================================================
# Usage:
#   docker compose up -d          # Start all nodes
#   docker compose ps             # Check status
#   docker compose logs -f        # Follow logs
#   docker compose down -v        # Tear down with volumes
# ============================================================================

services:
  # ─── Node 1 (Primary seed node) ───────────────────────────────────────────
  synapse-1:
    build: .
    container_name: synapse-1
    ports:
      - "9090:9090"
    environment:
      SYNAPSE_NODE_ID: node-1
      SYNAPSE_HOST: "0.0.0.0"
      SYNAPSE_PORT: "9090"
      SYNAPSE_PEERS: "synapse-2:9090,synapse-3:9090"
      SYNAPSE_LOG_LEVEL: "info"
    volumes:
      - synapse-data-1:/opt/synapse/data
    networks:
      - synapse-net
    restart: unless-stopped

  # ─── Node 2 ───────────────────────────────────────────────────────────────
  synapse-2:
    build: .
    container_name: synapse-2
    ports:
      - "9091:9090"
    environment:
      SYNAPSE_NODE_ID: node-2
      SYNAPSE_HOST: "0.0.0.0"
      SYNAPSE_PORT: "9090"
      SYNAPSE_PEERS: "synapse-1:9090,synapse-3:9090"
      SYNAPSE_LOG_LEVEL: "info"
    volumes:
      - synapse-data-2:/opt/synapse/data
    networks:
      - synapse-net
    restart: unless-stopped

  # ─── Node 3 ───────────────────────────────────────────────────────────────
  synapse-3:
    build: .
    container_name: synapse-3
    ports:
      - "9092:9090"
    environment:
      SYNAPSE_NODE_ID: node-3
      SYNAPSE_HOST: "0.0.0.0"
      SYNAPSE_PORT: "9090"
      SYNAPSE_PEERS: "synapse-1:9090,synapse-2:9090"
      SYNAPSE_LOG_LEVEL: "info"
    volumes:
      - synapse-data-3:/opt/synapse/data
    networks:
      - synapse-net
    restart: unless-stopped

volumes:
  synapse-data-1:
    driver: local
  synapse-data-2:
    driver: local
  synapse-data-3:
    driver: local

networks:
  synapse-net:
    driver: bridge
