[package]
name = "synapse-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# gRPC / Protobuf
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# ID generation
ulid = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
anyhow = "1"
thiserror = "2"
async-trait = "0.1"

[build-dependencies]
tonic-build = "0.12"
