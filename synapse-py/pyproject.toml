[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-memory"
version = "0.1.0"
description = "Python SDK for the Synapse distributed memory protocol for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Synapse Contributors" },
]
keywords = ["ai", "agents", "memory", "distributed", "protocol", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "grpcio>=1.60.0",
    "grpcio-tools>=1.60.0",
    "httpx>=0.25.0",
    "mcp>=1.0.0",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
synapse-mcp = "synapse_memory.mcp_server:main"

[project.urls]
Homepage = "https://github.com/synapse-protocol/synapse"
Documentation = "https://synapse-protocol.github.io/docs"
Repository = "https://github.com/synapse-protocol/synapse"

[tool.hatch.build.targets.wheel]
packages = ["synapse_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
